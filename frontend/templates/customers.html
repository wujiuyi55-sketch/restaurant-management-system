<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会员消费统计 - 饭店后台管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>👥 会员消费统计</h1>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <nav>
                <a href="/dashboard">📊 数据概览</a>
                <a href="/dishes">🍳 菜品管理</a>
                <a href="/customers" id="customerLink" class="active" style="display: none;">👥 会员消费统计</a>
                <a href="/orders">📋 订单管理</a>
                <a href="/sales">📈 销售统计</a>
                <a href="/employees">👨‍🍳 员工管理</a>
                <a href="/inventory">📦 库存管理</a>
                <a href="/vegetables">🥬 蔬菜采购</a>
                <a href="/meats">🥩 肉类采购</a>
                <a href="/fruits">🍎 水果采购</a>
                <a href="/analysis">🤖 智能分析</a>
                <a href="/chat">💬 AI对话</a>
                <a href="/chat-records">📝 对话记录</a>
                <a href="/users" id="userLink" style="display: none;">👤 用户管理</a>
                <a href="/account">🔐 账号管理</a>
            </nav>
        </div>
        
        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <h2>客户列表</h2>
                    <button class="add-btn" onclick="openAddModal()">添加客户</button>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>邮箱</th>
                                <th>消费金额</th>
                                <th>到店次数</th>
                                <th>最近消费</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加客户</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="dataId">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>电话</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label>消费金额</label>
                    <input type="number" id="total_spent" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label>到店次数</label>
                    <input type="number" id="visit_count" value="0">
                </div>
                <div class="form-group">
                    <label>最近消费</label>
                    <input type="date" id="last_visit">
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">取消</button>
                <button class="confirm-btn" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/customers.js"></script>
</body>
</html>
