<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话记录 - 饭店后台管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .record-text-cell {
            max-width: 320px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e5e7eb;
        }
        .record-text-cell.answer {
            max-width: 380px;
            color: #9ca3af;
        }
        .record-detail-block {
            margin-bottom: 20px;
        }
        .record-detail-block h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .record-detail-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 14px 16px;
            color: #f3f4f6;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        .record-detail-content.answer-box {
            background: rgba(102, 126, 234, 0.08);
            border-color: rgba(102, 126, 234, 0.3);
        }
        .empty-tip {
            text-align: center;
            padding: 40px 0;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 对话记录</h1>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <nav>
                <a href="/dashboard">📊 数据概览</a>
                <a href="/dishes">🍳 菜品管理</a>
                <a href="/customers" id="customerLink" style="display: none;">👥 会员消费统计</a>
                <a href="/orders">📋 订单管理</a>
                <a href="/sales">📈 销售统计</a>
                <a href="/employees">👨‍🍳 员工管理</a>
                <a href="/inventory">📦 库存管理</a>
                <a href="/vegetables">🥬 蔬菜采购</a>
                <a href="/meats">🥩 肉类采购</a>
                <a href="/fruits">🍎 水果采购</a>
                <a href="/analysis">🤖 智能分析</a>
                <a href="/chat">💬 AI对话</a>
                <a href="/chat-records" class="active">📝 对话记录</a>
                <a href="/users" id="userLink" style="display: none;">👤 用户管理</a>
                <a href="/account">🔐 账号管理</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="section">
                <h2>AI对话记录</h2>

                <div class="filter-bar">
                    <div class="filter-item">
                        <label>搜索内容</label>
                        <input type="text" id="searchKeyword" placeholder="搜索提问或回答内容" oninput="debounceSearch()">
                    </div>
                    <div class="filter-item">
                        <label>&nbsp;</label>
                        <button class="add-btn" onclick="loadRecords()">刷新</button>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th id="userColumn" style="display: none;">提问用户</th>
                                <th>提问内容</th>
                                <th>AI回答</th>
                                <th>时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordsBody">
                        </tbody>
                    </table>
                    <div class="empty-tip" id="emptyTip" style="display: none;">暂无对话记录</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="recordDetailModal" onclick="closeDetail()">
        <div class="modal-content large-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>对话详情</h3>
                <button class="close-modal-btn" onclick="closeDetail()">✕</button>
            </div>
            <div class="modal-body">
                <div class="order-detail-info">
                    <div class="detail-row">
                        <span class="detail-label">记录ID</span>
                        <span class="detail-value" id="detailId"></span>
                    </div>
                    <div class="detail-row" id="detailUserRow" style="display: none;">
                        <span class="detail-label">提问用户</span>
                        <span class="detail-value" id="detailUser"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">提问时间</span>
                        <span class="detail-value" id="detailTime"></span>
                    </div>
                </div>

                <div class="record-detail-block">
                    <h4>❓ 提问内容</h4>
                    <div class="record-detail-content" id="detailQuestion"></div>
                </div>

                <div class="record-detail-block">
                    <h4>🤖 AI回答</h4>
                    <div class="record-detail-content answer-box" id="detailAnswer"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeDetail()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat_records.js"></script>
</body>
</html>
