<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理 - 饭店后台管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>📦 库存管理</h1>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <nav>
                <a href="/dashboard">📊 数据概览</a>
                <a href="/dishes">🍳 菜品管理</a>
                <a href="/customers" id="customerLink" style="display: none;">👥 会员消费统计</a>
                <a href="/orders">📋 订单管理</a>
                <a href="/sales">📈 销售统计</a>
                <a href="/employees">👨‍🍳 员工管理</a>
                <a href="/inventory" class="active">📦 库存管理</a>
                <a href="/vegetables">🥬 蔬菜采购</a>
                <a href="/meats">🥩 肉类采购</a>
                <a href="/fruits">🍎 水果采购</a>
                <a href="/analysis">🤖 智能分析</a>
                <a href="/chat">💬 AI对话</a>
                <a href="/chat-records">📝 对话记录</a>
                <a href="/users" id="userLink" style="display: none;">👤 用户管理</a>
                <a href="/account">🔐 账号管理</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <h2>库存食材列表</h2>
                    <button class="add-btn" onclick="openAddModal()">添加食材</button>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>分类</th>
                                <th>数量</th>
                                <th>单位</th>
                                <th>最低库存</th>
                                <th>单价(元)</th>
                                <th>供应商</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>📦 库存可视化大屏</h2>
                </div>
                <div class="card-body">
                    <div class="charts-grid">
                        <div class="chart-container">
                            <h3>库存分类分布</h3>
                            <canvas id="categoryPieChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h3>库存数量排行</h3>
                            <canvas id="quantityBarChart"></canvas>
                        </div>
                    </div>
                    <div class="charts-grid">
                        <div class="chart-container">
                            <h3>库存价值统计</h3>
                            <canvas id="valueChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h3>低库存预警</h3>
                            <canvas id="lowStockChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加食材</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="dataId">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="category">
                        <option value="蔬菜">蔬菜</option>
                        <option value="肉类">肉类</option>
                        <option value="水产">水产</option>
                        <option value="调料">调料</option>
                        <option value="粮油">粮油</option>
                        <option value="禽蛋">禽蛋</option>
                        <option value="豆制品">豆制品</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数量</label>
                    <input type="number" id="quantity" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>单位</label>
                    <input type="text" id="unit" placeholder="如: 斤、kg、个" required>
                </div>
                <div class="form-group">
                    <label>最低库存</label>
                    <input type="number" id="min_stock" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>单价(元)</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>供应商</label>
                    <input type="text" id="supplier" placeholder="请输入供应商名称">
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">取消</button>
                <button class="confirm-btn" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/inventory.js"></script>
</body>
</html>
