<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - 饭店后台管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>👥 员工管理</h1>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <nav>
                <a href="/dashboard">📊 数据概览</a>
                <a href="/dishes">🍳 菜品管理</a>
                <a href="/customers" id="customerLink" style="display: none;">👥 会员消费统计</a>
                <a href="/orders">📋 订单管理</a>
                <a href="/sales">📈 销售统计</a>
                <a href="/employees" class="active">👨‍🍳 员工管理</a>
                <a href="/inventory">📦 库存管理</a>
                <a href="/vegetables">🥬 蔬菜采购</a>
                <a href="/meats">🥩 肉类采购</a>
                <a href="/fruits">🍎 水果采购</a>
                <a href="/analysis">🤖 智能分析</a>
                <a href="/chat">💬 AI对话</a>
                <a href="/chat-records">📝 对话记录</a>
                <a href="/users" id="userLink" style="display: none;">👤 用户管理</a>
                <a href="/account">🔐 账号管理</a>
            </nav>
        </div>
        
        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <h2>员工列表</h2>
                    <button class="add-btn" onclick="openAddModal()">添加员工</button>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>职位</th>
                                <th>薪资</th>
                                <th>入职日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>👨‍💼 员工数据可视化大屏</h2>
                </div>
                <div class="card-body">
                    <div class="charts-grid">
                        <div class="chart-container">
                            <h3>职位分布</h3>
                            <canvas id="positionChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h3>薪资分布</h3>
                            <canvas id="salaryChart"></canvas>
                        </div>
                    </div>
                    <div class="charts-grid">
                        <div class="chart-container">
                            <h3>在职状态统计</h3>
                            <canvas id="statusChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <h3>入职时间分布</h3>
                            <canvas id="hireChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加员工</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="dataId">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>电话</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label>职位</label>
                    <input type="text" id="position">
                </div>
                <div class="form-group">
                    <label>薪资</label>
                    <input type="number" id="salary" step="0.01">
                </div>
                <div class="form-group">
                    <label>入职日期</label>
                    <input type="date" id="hire_date">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="status">
                        <option value="1">在职</option>
                        <option value="0">离职</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">取消</button>
                <button class="confirm-btn" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/employees.js"></script>
</body>
</html>
