<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 饭店后台管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
        }

        /* ===== 左侧图片区 ===== */
        .login-visual {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

        .login-visual img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-visual::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.35) 45%, rgba(15, 23, 42, 0.55) 100%);
        }

        .visual-content {
            position: absolute;
            z-index: 2;
            bottom: 60px;
            left: 56px;
            right: 56px;
            color: #fff;
        }

        .visual-content .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .visual-content .brand .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .visual-content h2 {
            font-size: 40px;
            line-height: 1.25;
            margin: 0 0 14px;
            font-weight: 700;
        }

        .visual-content h2 span {
            background: linear-gradient(135deg, #fbbf24, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .visual-content p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.75);
            margin: 0;
            line-height: 1.7;
            max-width: 420px;
        }

        .visual-stats {
            display: flex;
            gap: 36px;
            margin-top: 32px;
        }

        .visual-stats .stat b {
            display: block;
            font-size: 22px;
            color: #fbbf24;
        }

        .visual-stats .stat span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== 右侧表单区 ===== */
        .login-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: radial-gradient(circle at 20% 20%, rgba(102, 126, 234, 0.12), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.1), transparent 50%),
                        #0f172a;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            margin-bottom: 36px;
        }

        .login-header .logo {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35);
        }

        .login-header h1 {
            color: #fff;
            font-size: 26px;
            margin: 0 0 8px;
            font-weight: 700;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f59e0b;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(239, 68, 68, 0.45);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .login-visual { display: none; }
            body { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="login-visual">
        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Luxurious%20Chinese%20restaurant%20interior%20at%20evening%2C%20warm%20golden%20ambient%20lighting%2C%20elegant%20dark%20wooden%20decor%2C%20red%20lanterns%2C%20fine%20dining%20table%20with%20gourmet%20dishes%2C%20cinematic%20atmosphere%2C%20professional%20photography%2C%20high%20detail&image_size=portrait_4_3" alt="餐厅环境">
        <div class="visual-content">
            <div class="brand">
                <div class="brand-icon">🍽️</div>
                美味餐厅
            </div>
            <h2>智慧餐饮<br><span>一体化管理平台</span></h2>
            <p>从点餐、收银到库存与经营分析，一站式提升餐厅运营效率，让美味与数据同行。</p>
            <div class="visual-stats">
                <div class="stat"><b>2200+</b><span>月度订单</span></div>
                <div class="stat"><b>98%</b><span>客户好评率</span></div>
                <div class="stat"><b>24h</b><span>稳定运营</span></div>
            </div>
        </div>
    </div>

    <div class="login-panel">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">🍽️</div>
                <h1>欢迎回来</h1>
                <p>登录您的账号，进入后台管理系统</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">登 录</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.message || '登录失败，请重试';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.classList.add('show');
                console.error('Login error:', error);
            }
        });
        
        // 输入时隐藏错误
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('errorMessage').classList.remove('show');
            });
        });
    </script>
</body>
</html>
