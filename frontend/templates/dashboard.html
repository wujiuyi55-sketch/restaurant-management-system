<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据概览 - 饭店后台管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>📊 数据概览</h1>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <nav>
                <a href="/dashboard" class="active">📊 数据概览</a>
                <a href="/dishes">🍳 菜品管理</a>
                <a href="/customers" id="customerLink" style="display: none;">👥 会员消费统计</a>
                <a href="/orders">📋 订单管理</a>
                <a href="/sales">📈 销售统计</a>
                <a href="/employees">👨‍🍳 员工管理</a>
                <a href="/inventory">📦 库存管理</a>
                <a href="/vegetables">🥬 蔬菜采购</a>
                <a href="/meats">🥩 肉类采购</a>
                <a href="/fruits">🍎 水果采购</a>
                <a href="/analysis">🤖 智能分析</a>
                <a href="/chat">💬 AI对话</a>
                <a href="/chat-records">📝 对话记录</a>
                <a href="/users" id="userLink" style="display: none;">👤 用户管理</a>
                <a href="/account">🔐 账号管理</a>
            </nav>
        </div>
        
        <div class="main-content">
            <div class="section">
                <h2>数据概览</h2>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalRevenue">--</div>
                        <div class="stat-label">总营业额</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalOrders">--</div>
                        <div class="stat-label">总订单数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalDishes">--</div>
                        <div class="stat-label">菜品数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalCustomers">--</div>
                        <div class="stat-label">客户数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="avgOrderValue">--</div>
                        <div class="stat-label">平均客单价</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="topDish">--</div>
                        <div class="stat-label">热销菜品</div>
                    </div>
                </div>
                <div class="charts-container">
                    <div class="chart-card">
                        <h3>月度销售额趋势</h3>
                        <canvas id="salesChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>菜品分类销售占比</h3>
                        <canvas id="categoryChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>热销菜品TOP5</h3>
                        <canvas id="topDishesChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>客户消费等级分布</h3>
                        <canvas id="customerChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
